name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  demo:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: The three verdicts and a valid chain
        run: |
          set -o pipefail
          out=$(python3 run_demo.py)
          echo "$out"
          grep -q "quote_service  CONFIRMED" <<<"$out"
          grep -q "invoice_check  CONFIRMED" <<<"$out"
          grep -q "invoice_check  REFUTED" <<<"$out"
          grep -q '"ok": true, "count": 3' <<<"$out"
      - name: Editing a receipt breaks the chain
        run: |
          set -o pipefail
          out=$(python3 run_demo.py --tamper)
          echo "$out"
          grep -q '"ok": false, "at": 2' <<<"$out"
